name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all packages
        run: npx turbo typecheck

  lint:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check "packages/**/*.{ts,tsx}" "apps/**/*.{ts,tsx}"

  test:
    name: Test (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 (not the 20 the other jobs use): the ported localDb
      # migration suite (apps/mobile) uses `node:sqlite`, unflagged from
      # 22.x onward. It skips gracefully on older Node either way — see
      # apps/mobile/src/services/sync/__tests__/localDb.migration.test.ts
      # — so this floor only affects whether that suite actually runs.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npx turbo test

      - name: Unreferenced exports (knip) — packages/shared is a real gate
        # fix-plan item 4.3: packages/shared has zero knip findings after
        # this item's cleanup (dead files, the divergent-formula hooks,
        # the orphaned style keys) — so this scope fails the build on any
        # new dead export instead of just reporting it. `knip.json`'s
        # `ignore` list documents the structural false positives (config
        # plugins loaded by string path, Edge Functions invoked over
        # HTTP, docs preview jsx) that made a blanket gate infeasible.
        run: npx knip --workspace packages/shared

      - name: Unreferenced exports (knip) — apps/mobile/src is a real gate
        # fix-plan item 4.3, closed: apps/mobile/src's ~24 unused-export
        # findings are cleared (genuinely dead code deleted; the rest were
        # exports only ever consumed within their own defining file —
        # real usage knip's cross-file heuristic can't see — covered by
        # `knip.json`'s `workspaces["apps/mobile"].ignoreExportsUsedInFile`
        # instead of deleting live code). `--exports` scopes this step to
        # export-related issue types only (exports, types, enum/namespace
        # members, duplicates) — apps/mobile still carries pre-existing,
        # out-of-scope dependency/unlisted/unresolved findings that stay
        # on the report-only step below until swept separately.
        run: npx knip --workspace apps/mobile --exports

      - name: Unreferenced exports (knip) — full repo, report only
        # apps/web still carries pre-existing findings outside fix-plan
        # 4.3's named scope (packages/shared and apps/mobile/src only —
        # see its terse report), and apps/mobile still carries pre-existing
        # dependency/unlisted/unresolved findings the two gated steps above
        # don't cover — flip continue-on-error off here once both are
        # cleared the same way packages/shared and apps/mobile/src's
        # exports were.
        continue-on-error: true
        run: npx knip

  db-types:
    name: DB types in sync with schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate database.types.ts and diff against committed copy
        # fix-plan 1.2. Needs a Management API access token (never the
        # anon or service-role key) — see
        # packages/shared/scripts/gen-db-types.sh. Report-only until
        # SUPABASE_ACCESS_TOKEN is provisioned as a repo secret, same
        # pattern as the knip step in the `test` job above.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN not set — skipping until provisioned."
            exit 0
          fi
          npm run -w @voice-expense/shared gen:types
          git diff --exit-code -- packages/shared/src/types/database.types.ts

  eslint:
    name: ESLint (no-restricted-syntax scaffolding)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Every audit-tracking rule in eslint.config.mjs starts at 'off'
        # and flips to 'error' as the fix-plan item that owns it lands
        # (see the file's header comment) — period-restrictions,
        # mobile-clearance-restrictions and mobile-i18n-restrictions are
        # 'error' already; this job is expected to be clean today either
        # way, since a rule only flips once its surface is swept.
        run: npx turbo lint
