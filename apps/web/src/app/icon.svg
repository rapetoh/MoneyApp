<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!--
    Browser-tab favicon: Coin & Wave on the cream tile with ROUNDED
    corners (Aug 29, 2026 owner request: the square tile looked dated in
    the tab bar). Radius = 22% of the tile, the same ratio every other
    Murmur tile uses (MurmurMark rounded, app icon mask). Corners are
    transparent, so the rounding survives on any tab background.
    Art matches assets/brand/murmur-mark-favicon.svg: coin at 75% keyline,
    primary wave only (fine detail reads as noise at favicon sizes).
  -->
  <defs>
    <radialGradient id="coin" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#5C7B5A"/>
      <stop offset="100%" stop-color="#2D4530"/>
    </radialGradient>
    <clipPath id="tile">
      <rect width="192" height="192" rx="42" ry="42"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="192" height="192" fill="#FBFAF7"/>
    <g transform="translate(3.1 3.1) scale(1.1613)">
      <circle cx="80" cy="80" r="62" fill="url(#coin)"/>
      <path d="M40 82 Q 55 66, 70 82 T 100 82 T 130 82" stroke="#FBFAF7" stroke-width="7"
            fill="none" stroke-linecap="round" opacity="0.95"/>
    </g>
  </g>
</svg>
