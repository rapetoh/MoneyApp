appId: com.murmur.app
productName: Murmur
copyright: Copyright © 2026 Murmur

directories:
  output: release
  buildResources: build

afterPack: build/afterPack.cjs

files:
  - dist/main.js
  - dist/main.js.map
  - dist/preload.js
  - dist/preload.js.map
  - package.json

# No secret may ship in or be read from the packaged app: the embedded
# Next server serves UI only, and /api/ai/* is forwarded to the hosted
# deployment by src/main.ts. The .env exclusion keeps any stray env
# file (e.g. copied into a future standalone build) out of Resources.
extraResources:
  - from: dist/web
    to: web
    filter:
      - '**/*'
      - '!**/.env*'

# Release config = SIGNED + notarized (Aug 29, 2026). This file describes
# the shippable artifact; the dev-only unsigned path is `npm run pack`,
# which overrides identity/notarize off on the CLI. Requirements at
# release time: a "Developer ID Application" identity in the login
# keychain, and APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID in
# the env for notarization. afterPack.cjs ad-hoc-signs ONLY when no real
# identity was used, so dev builds still launch.
mac:
  category: public.app-category.finance
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  gatekeeperAssess: false
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true

dmg:
  title: Install Murmur
  background: null
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  # Unsigned v1 — Windows SmartScreen will warn on first launch and the
  # user must click "More info → Run anyway" once. When a code-signing
  # cert is wired up (EV cert recommended for SmartScreen reputation),
  # set CSC_LINK + CSC_KEY_PASSWORD env vars at build time.

nsis:
  # One-step install: writes the app to Program Files for the current
  # user, drops a Start-menu shortcut + desktop shortcut, no installer
  # wizard pages. Standard "looks like a real Windows app" experience.
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Murmur
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}

# Auto-update + download hosting: public GitHub releases repo (the code
# repo stays private; releases live in their own public repo so download
# URLs and the electron-updater feed need no auth). `dist`/`dist:win`
# write latest-mac.yml / latest.yml + blockmaps into release/, and the
# release script uploads everything with `gh release`.
publish:
  provider: github
  owner: rapetoh
  repo: murmur-releases
