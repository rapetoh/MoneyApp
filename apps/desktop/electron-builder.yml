appId: com.murmur.app
productName: Murmur
copyright: Copyright © 2026 Murmur

directories:
  output: release
  buildResources: build

afterPack: build/afterPack.cjs

files:
  - dist/main.js
  - dist/main.js.map
  - dist/preload.js
  - dist/preload.js.map
  - package.json

# No secret may ship in or be read from the packaged app: the embedded
# Next server serves UI only, and /api/ai/* is forwarded to the hosted
# deployment by src/main.ts. The .env exclusion keeps any stray env
# file (e.g. copied into a future standalone build) out of Resources.
extraResources:
  - from: dist/web
    to: web
    filter:
      - '**/*'
      - '!**/.env*'

mac:
  category: public.app-category.finance
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  gatekeeperAssess: false
  # Unsigned v1 build — ad-hoc signature only. When the Developer ID
  # Application cert is wired up, set:
  #   CSC_LINK / CSC_KEY_PASSWORD env vars (or signing identity) +
  #   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID for
  # notarization, and re-enable hardenedRuntime + entitlements:
  #   hardenedRuntime: true
  #   entitlements: build/entitlements.mac.plist
  #   entitlementsInherit: build/entitlements.mac.plist
  identity: null

dmg:
  title: Install Murmur
  background: null
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  # Unsigned v1 — Windows SmartScreen will warn on first launch and the
  # user must click "More info → Run anyway" once. When a code-signing
  # cert is wired up (EV cert recommended for SmartScreen reputation),
  # set CSC_LINK + CSC_KEY_PASSWORD env vars at build time.

nsis:
  # One-step install: writes the app to Program Files for the current
  # user, drops a Start-menu shortcut + desktop shortcut, no installer
  # wizard pages. Standard "looks like a real Windows app" experience.
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Murmur
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
