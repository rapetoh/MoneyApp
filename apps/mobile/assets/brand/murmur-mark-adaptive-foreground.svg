<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Android adaptive-icon foreground.
    Android applies its own circular / squircle / rounded-square mask, so the
    foreground must keep the actual mark inside the central 66% safe zone
    (Google's spec: foreground is 108dp on a 108dp canvas, safe zone is 66dp).
    For 1024px canvas: safe-zone diameter = ~675px, centered.
    Background is transparent (Expo's adaptiveIcon.backgroundColor handles fill).
  -->
  <g transform="translate(316 316) scale(2.45)">
    <path d="M80 18 C 122 18, 142 50, 142 86 C 142 118, 116 142, 80 142
             C 70 142, 60 140, 52 136 L 30 142 L 38 122
             C 24 110, 18 96, 18 86 C 18 50, 38 18, 80 18 Z"
          fill="#1B1915"/>
    <circle cx="80" cy="80" r="6" fill="#FBFAF7"/>
    <path d="M64 80 a16 16 0 0 1 32 0"
          stroke="#FBFAF7" stroke-width="3.5" fill="none"
          stroke-linecap="round" opacity="0.85"/>
    <path d="M52 80 a28 28 0 0 1 56 0"
          stroke="#FBFAF7" stroke-width="3" fill="none"
          stroke-linecap="round" opacity="0.45"/>
  </g>
</svg>
