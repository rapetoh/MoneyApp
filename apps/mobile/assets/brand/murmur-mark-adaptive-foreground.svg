<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Android adaptive-icon foreground — Coin & Wave (Aug 7, 2026).
    Android applies its own circular / squircle / rounded-square mask
    over the central 72/108 of this canvas; the safe zone is the central
    66/108. Background is transparent — Expo's adaptiveIcon.backgroundColor
    provides the fill.

    Coin size (Aug 16, 2026): the coin sits on Material's circular
    keyline — 52/108 of the canvas (493 px of 1024, i.e. 72% of the
    visible 72 dp mask), the same visual weight as the iOS icon's 75%
    keyline. It was 304 px (30% of canvas, 44% of the visible mask).
    scale = 493/124; translate = (1024 - 160*scale)/2.
  -->
  <defs>
    <radialGradient id="coin" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#5C7B5A"/>
      <stop offset="100%" stop-color="#2D4530"/>
    </radialGradient>
  </defs>
  <g transform="translate(193.9 193.9) scale(3.976)">
    <circle cx="80" cy="80" r="62" fill="url(#coin)"/>
    <circle cx="80" cy="80" r="62" fill="none" stroke="#FBFAF7" stroke-width="1" opacity="0.18"/>
    <circle cx="80" cy="80" r="50" fill="none" stroke="#FBFAF7" stroke-width="1" opacity="0.18"/>
    <path d="M40 80 Q 55 64, 70 80 T 100 80 T 130 80" stroke="#FBFAF7" stroke-width="5"
          fill="none" stroke-linecap="round" opacity="0.95"/>
    <path d="M40 96 Q 55 86, 70 96 T 100 96 T 120 96" stroke="#FBFAF7" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.45"/>
  </g>
</svg>
