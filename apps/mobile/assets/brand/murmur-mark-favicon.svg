<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!--
    Favicon — Coin & Wave (Aug 7, 2026). At favicon sizes the fine inner
    rings and the faint second wave read as noise (same principle as the
    old mark dropping its pulse ≤24px), so this keeps coin + primary wave
    only, with a slightly heavier stroke.

    Coin size (Aug 16, 2026): 75% of the tile (144 px of 192), matching
    the app icon's keyline. Was 93 px (48%). scale = 144/124;
    translate = (192 - 160*scale)/2.
  -->
  <defs>
    <radialGradient id="coin" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#5C7B5A"/>
      <stop offset="100%" stop-color="#2D4530"/>
    </radialGradient>
  </defs>
  <rect width="192" height="192" fill="#FBFAF7"/>
  <g transform="translate(3.1 3.1) scale(1.1613)">
    <circle cx="80" cy="80" r="62" fill="url(#coin)"/>
    <path d="M40 82 Q 55 66, 70 82 T 100 82 T 130 82" stroke="#FBFAF7" stroke-width="7"
          fill="none" stroke-linecap="round" opacity="0.95"/>
  </g>
</svg>
