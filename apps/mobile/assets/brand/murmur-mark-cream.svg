<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Murmur — The Listening Drop, default cream variant.
    Source of truth: docs/money-app/project/Murmur Brand Sheet.html §02
    "Default · Cream". The brand sheet's drop is on a 160-unit grid with
    inner-pulse radii 6 / 16 / 28 (stroke widths 3.5 / 3, opacities 0.85 /
    0.45). Scaled here to a 1024-unit canvas (multiplier 6.4) for App Store
    rasterization. The 22% iOS corner mask is NOT pre-applied — iOS rounds
    its own corners.
  -->
  <rect width="1024" height="1024" fill="#FBFAF7"/>
  <g transform="translate(192 192) scale(4.25)">
    <path d="M80 18 C 122 18, 142 50, 142 86 C 142 118, 116 142, 80 142
             C 70 142, 60 140, 52 136 L 30 142 L 38 122
             C 24 110, 18 96, 18 86 C 18 50, 38 18, 80 18 Z"
          fill="#1B1915"/>
    <circle cx="80" cy="80" r="6" fill="#FBFAF7"/>
    <path d="M64 80 a16 16 0 0 1 32 0"
          stroke="#FBFAF7" stroke-width="3.5" fill="none"
          stroke-linecap="round" opacity="0.85"/>
    <path d="M52 80 a28 28 0 0 1 56 0"
          stroke="#FBFAF7" stroke-width="3" fill="none"
          stroke-linecap="round" opacity="0.45"/>
  </g>
</svg>
