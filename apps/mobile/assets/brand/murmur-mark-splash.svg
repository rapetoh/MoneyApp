    <circle cx="80" cy="80" r="62" fill="none" stroke="#FBFAF7" stroke-width="1" opacity="0.18"/>
    <circle cx="80" cy="80" r="50" fill="none" stroke="#FBFAF7" stroke-width="1" opacity="0.18"/>
    <path d="M40 80 Q 55 64, 70 80 T 100 80 T 130 80" stroke="#FBFAF7" stroke-width="5"
