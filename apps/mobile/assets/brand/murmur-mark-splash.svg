<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Splash icon. Expo's splash plugin centers this on the splash bg
    (#FBFAF7 cream), so this SVG keeps a transparent background and a larger
    mark — about 32% of the device width per the brand sheet's splash mock
    (120px mark on a 280px device frame). 1024 × 0.32 ≈ 328px mark; we draw
    it at 384 for more presence on tablets / large devices.
  -->
  <g transform="translate(320 320) scale(2.4)">
    <path d="M80 18 C 122 18, 142 50, 142 86 C 142 118, 116 142, 80 142
             C 70 142, 60 140, 52 136 L 30 142 L 38 122
             C 24 110, 18 96, 18 86 C 18 50, 38 18, 80 18 Z"
          fill="#1B1915"/>
    <circle cx="80" cy="80" r="6" fill="#FBFAF7"/>
    <path d="M64 80 a16 16 0 0 1 32 0"
          stroke="#FBFAF7" stroke-width="3.5" fill="none"
          stroke-linecap="round" opacity="0.85"/>
    <path d="M52 80 a28 28 0 0 1 56 0"
          stroke="#FBFAF7" stroke-width="3" fill="none"
          stroke-linecap="round" opacity="0.45"/>
  </g>
</svg>
