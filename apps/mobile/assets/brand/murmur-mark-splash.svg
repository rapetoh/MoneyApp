<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Splash / launch-screen mark — Coin & Wave (Aug 7, 2026; re-cropped
    Aug 16, 2026). Transparent canvas: the cream background is painted by
    the OS launch screen (expo-splash-screen plugin, app.config.js) and by
    the JS handoff overlay (src/components/LaunchScreen.tsx) — both read
    assets/brand/launch.js.

    The coin is cropped tight (983 px of 1024, 2% margin for the anti-
    aliased edge) so `imageWidth` in launch.js is, to within a couple of
    points, the on-screen diameter of the coin. Before Aug 16 the coin was
    298 px on a 1024 canvas, so the plugin's imageWidth would have shown a
    ~35 pt coin — but the plugin wasn't given the image at all (see the
    NOTE in app.config.js), so nothing showed. scale = 983/124;
    translate = (1024 - 160*scale)/2.
  -->
  <defs>
    <radialGradient id="coin" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#5C7B5A"/>
      <stop offset="100%" stop-color="#2D4530"/>
    </radialGradient>
  </defs>
  <g transform="translate(-122.2 -122.2) scale(7.927)">
    <circle cx="80" cy="80" r="62" fill="url(#coin)"/>
    <circle cx="80" cy="80" r="62" fill="none" stroke="#FBFAF7" stroke-width="1" opacity="0.18"/>
    <circle cx="80" cy="80" r="50" fill="none" stroke="#FBFAF7" stroke-width="1" opacity="0.18"/>
    <path d="M40 80 Q 55 64, 70 80 T 100 80 T 130 80" stroke="#FBFAF7" stroke-width="5"
          fill="none" stroke-linecap="round" opacity="0.95"/>
    <path d="M40 96 Q 55 86, 70 96 T 100 96 T 120 96" stroke="#FBFAF7" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.45"/>
  </g>
</svg>
